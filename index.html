    <script>
      // Global sandbox compatibility: ensure window.fetch has both getter and setter
      (function () {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch || originalFetch;
            },
            set(newFetch) {
              currentFetch = typeof newFetch === 'function' ? newFetch : originalFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Fallback if property is non-configurable
        }
      })();
    </script>
